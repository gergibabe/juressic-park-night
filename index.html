<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080806">
<meta name="description" content="An interactive Jurassic Night invitation.">
<title>You're Invited — Jurassic Night</title>
<style>
  :root{--bg:#080806;--paper:#d8d0b8;--ink:#171713;--acid:#c9c15a;--red:#9d211c}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:#eee;font-family:Georgia,'Times New Roman',serif}
  body{overflow-x:hidden}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 4px),radial-gradient(circle at 20% 20%,rgba(255,255,255,.2),transparent 30%);mix-blend-mode:screen;z-index:50}
  .stage{min-height:100svh;display:grid;place-items:center;padding:28px 18px;position:relative;overflow:hidden;background:radial-gradient(ellipse at center, #222218 0%, #0d0d0a 48%, #030303 100%)}
  .stage:after{content:"";position:absolute;inset:-10%;background:linear-gradient(105deg,transparent 0 44%,rgba(255,255,255,.025) 47%,transparent 50%);transform:translateX(-80%);animation:scan 9s linear infinite;pointer-events:none}
  @keyframes scan{to{transform:translateX(80%)}}
  .scene{width:min(92vw,720px);height:min(92svh,860px);min-height:620px;position:relative;display:grid;place-items:center;perspective:1200px}
  .hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:30;letter-spacing:.18em;text-transform:uppercase;font:600 10px/1.4 Arial,sans-serif;color:#aaa;white-space:nowrap;transition:opacity .35s}
  .hint b{color:#d9d3b7}
  .postcard{position:absolute;z-index:10;width:min(78vw,560px);height:min(78vh,690px);max-height:78%;display:grid;place-items:center;cursor:pointer;transform-style:preserve-3d;transition:filter .4s;filter:drop-shadow(0 25px 30px rgba(0,0,0,.65));user-select:none;-webkit-tap-highlight-color:transparent}
  .postcard img{width:100%;height:100%;object-fit:contain;display:block;border-radius:2px;box-shadow:0 2px 0 rgba(255,255,255,.05) inset}
  .postcard .shine{position:absolute;inset:0;overflow:hidden;border-radius:2px;pointer-events:none;opacity:.18}
  .postcard .shine:after{content:"";position:absolute;width:35%;height:150%;top:-25%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.25),transparent);transform:rotate(8deg);animation:shine 5.5s ease-in-out infinite}
  @keyframes shine{0%,60%{left:-50%}100%{left:130%}}
  .vhs{position:absolute;z-index:20;width:min(68vw,500px);left:50%;top:50%;transform:translate(-50%,40%) scale(.88) rotateX(5deg);opacity:0;pointer-events:none;transform-origin:center bottom;filter:drop-shadow(0 20px 20px rgba(0,0,0,.75));transition:none}
  .vhs img{display:block;width:100%;height:auto;border-radius:7px}
  .vhs:after{content:"";position:absolute;inset:3% 2%;border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 0 22px rgba(0,0,0,.25) inset;pointer-events:none}
  .scene.open .postcard{animation:press .55s cubic-bezier(.2,.8,.2,1) forwards;z-index:8}
  .scene.open .hint{opacity:0}
  .scene.open .vhs{animation:pullout 1.35s cubic-bezier(.18,.82,.2,1) .22s forwards;pointer-events:auto;cursor:pointer}
  .scene.open .vhs:before{content:"";position:absolute;inset:0;border-radius:7px;box-shadow:0 0 0 0 rgba(201,193,90,0);animation:glow .9s ease 1.35s forwards;pointer-events:none}
  @keyframes press{0%{transform:translateZ(0) scale(1) rotate(0)}22%{transform:translateZ(-18px) scale(.985) rotate(-.4deg)}100%{transform:translateZ(0) scale(1) rotate(-1deg)}}
  @keyframes pullout{0%{opacity:0;transform:translate(-50%,40%) scale(.88) rotateX(5deg)}45%{opacity:1}78%{transform:translate(-50%,-63%) scale(1.02) rotateX(0deg)}90%{transform:translate(-50%,-57%) scale(1.005) rotateX(0deg)}100%{opacity:1;transform:translate(-50%,-60%) scale(1) rotateX(0deg)}}
  @keyframes glow{to{box-shadow:0 0 32px rgba(201,193,90,.25)}}
  .vhs-label{position:absolute;left:50%;top:calc(100% + 14px);transform:translateX(-50%);font:600 9px/1 Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#b8b5a2;white-space:nowrap;opacity:0;transition:opacity .3s .4s}
  .scene.open .vhs-label{opacity:1}
  .instructions{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);font:10px/1.3 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#777;white-space:nowrap}
  .modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:22px;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .35s}
  .modal.show{opacity:1;pointer-events:auto}
  .ticket{width:min(92vw,540px);background:var(--paper);color:var(--ink);padding:34px 28px 30px;position:relative;box-shadow:0 25px 80px #000;transform:translateY(20px) rotate(-1deg);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  .modal.show .ticket{transform:translateY(0) rotate(-1deg)}
  .ticket:before{content:"";position:absolute;inset:9px;border:1px solid rgba(23,23,19,.3);pointer-events:none}
  .ticket .mini{font:700 9px/1.4 Arial,sans-serif;letter-spacing:.25em;text-transform:uppercase;text-align:center}
  .ticket h1{font-size:clamp(42px,10vw,68px);line-height:.82;text-align:center;margin:20px 0 12px;letter-spacing:-.05em}
  .ticket .rule{height:1px;background:rgba(23,23,19,.4);margin:18px 0}
  .details{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:center}
  .details strong{display:block;font-size:25px;margin-top:4px}
  .ticket .message{text-align:center;font-size:17px;line-height:1.5;margin:20px auto;max-width:400px}
  .close{position:absolute;right:18px;top:15px;border:0;background:none;font-size:25px;cursor:pointer;color:var(--ink)}
  .small{font:9px/1.5 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;text-align:center;margin-top:20px;opacity:.65}
  @media(max-height:700px){.scene{min-height:540px}.postcard{max-height:72%}.vhs{width:min(62vw,430px)}}
  @media(max-width:480px){.scene{width:100vw;height:100svh;min-height:580px}.postcard{width:84vw;max-height:72%}.vhs{width:76vw}.hint{top:18px}.instructions{bottom:18px}.ticket{padding:30px 22px 26px}}
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="stage">
  <div class="scene" id="scene" aria-label="Interactive invitation">
    <div class="hint"><b>YOU'RE INVITED</b> · tap the postcard</div>
    <button class="postcard" id="postcard" aria-label="Open invitation">
      <img src="assets/postcard.jpeg" alt="Jurassic Park invitation postcard">
      <span class="shine"></span>
    </button>
    <button class="vhs" id="vhs" aria-label="Open VHS invitation">
      <img src="assets/vhs.jpeg" alt="VHS cassette invitation dated 10 October 2026 at 6pm">
      <span class="vhs-label">tap the tape to open</span>
    </button>
    <div class="instructions">JURASSIC NIGHT · 10.10.2026 · 6PM</div>
  </div>
</main>

<section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="title">
  <article class="ticket">
    <button class="close" id="close" aria-label="Close">×</button>
    <div class="mini">YOU'RE INVITED · PRIVATE SCREENING</div>
    <h1 id="title">JURASSIC<br>NIGHT</h1>
    <div class="rule"></div>
    <div class="details">
      <div><span class="mini">DATE</span><strong>10.10.2026</strong></div>
      <div><span class="mini">TIME</span><strong>6:00 PM</strong></div>
    </div>
    <div class="rule"></div>
    <p class="message">A night of dinosaurs, popcorn, food & drinks.<br><br><strong>@ MY HOUSE</strong></p>
    <div class="small">Come for the movie. Stay for the chaos.</div>
  </article>
</section>

<script>
  const scene=document.getElementById('scene');
  const postcard=document.getElementById('postcard');
  const vhs=document.getElementById('vhs');
  const modal=document.getElementById('modal');
  const close=document.getElementById('close');
  let opened=false;
  function openPostcard(){if(opened)return;opened=true;scene.classList.add('open');}
  postcard.addEventListener('click',openPostcard);
  postcard.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPostcard()}});
  vhs.addEventListener('click',()=>{if(opened)modal.classList.add('show');});
  close.addEventListener('click',()=>modal.classList.remove('show'));
  modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show')});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('show')});
</script>
</body>
</html>
